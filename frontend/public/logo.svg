<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16223D"/>
      <stop offset="1" stop-color="#0B1428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- App icon base shape (superellipse-ish rounded square) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#2A3A5C" stroke-width="1"/>

  <!-- Image frame, positioned upper-center, representing the source photo -->
  <rect x="140" y="118" width="232" height="176" rx="20" fill="none" stroke="#E7ECF5" stroke-width="14"/>

  <!-- sun/circle inside the frame -->
  <circle cx="196" cy="172" r="18" fill="#E7ECF5"/>

  <!-- mountain line inside the frame, its right peak stretches down and becomes the text line below -->
  <path d="M 158 262
           L 214 206
           L 254 244
           L 296 200
           L 356 262"
        fill="none" stroke="#E7ECF5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The transformation: mountain's descending line flows into a horizontal "alt text" line below the frame -->
  <path d="M 356 262 C 366 292, 366 316, 356 330" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

  <!-- Alt-text lines (the "description" the image becomes) -->
  <rect x="140" y="330" width="232" height="16" rx="8" fill="url(#accent)"/>
  <rect x="140" y="366" width="164" height="16" rx="8" fill="url(#accent)" opacity="0.55"/>

  <!-- small review checkmark badge, bottom-right of the image frame -->
  <circle cx="372" cy="294" r="30" fill="#0B1428" stroke="url(#accent)" stroke-width="6"/>
  <path d="M 358 294 L 368 304 L 388 282" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
